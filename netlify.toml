[build]
  publish = "."

[[redirects]]
  from = "/black-friday"
  to = "/black-friday.html"
  status = 200

[[redirects]]
  from = "/black-friday-thank-you"
  to = "/black-friday-thank-you.html"
  status = 200

[[redirects]]
  from = "/clearance"
  to = "/clearance.html"
  status = 200

[[redirects]]
  from = "/clearance-thank-you"
  to = "/clearance-thank-you.html"
  status = 200

[[redirects]]
  from = "/amish-solid-wood"
  to = "/amish-solid-wood.html"
  status = 200

[[redirects]]
  from = "/amish-solid-wood-thank-you"
  to = "/amish-solid-wood-thank-you.html"
  status = 200

[[redirects]]
  from = "/leather"
  to = "/leather.html"
  status = 200

[[redirects]]
  from = "/leather-thank-you"
  to = "/leather-thank-you.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
